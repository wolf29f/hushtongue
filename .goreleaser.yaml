version: 2

builds:
  - id: hushtongue-gm
    binary: hushtongue-gm
    main: ./cmd
    tags: [gm]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/wolf29f/hushtongue/internal/config.Version=v{{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: hushtongue-player
    binary: hushtongue-player
    main: ./cmd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/wolf29f/hushtongue/internal/config.Version=v{{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # One archive per app, rather than both apps in the same archive
  - id: hushtongue-gm
    ids: [hushtongue-gm]
    formats: [tar.gz]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [binary]

  - id: hushtongue-player
    ids: [hushtongue-player]
    formats: [tar.gz]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [binary]

changelog:
  use: github

release:
  # A tag with a suffix (v0.2.0-rc1) is a prerelease
  prerelease: auto
