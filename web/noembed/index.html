    <h1>Front non buildé</h1>
    <p>
      Ce serveur a été compilé sans le front. En développement, lancez <code>npm run dev</code> dans
      <code>web/</code> et ouvrez <a href="http://localhost:5173">http://localhost:5173</a>. Pour
      embarquer le front, lancez <code>npm run build</code> dans <code>web/</code>, puis compilez le
      serveur avec <code>go build -tags embed ./cmd/server</code>.
    </p>
