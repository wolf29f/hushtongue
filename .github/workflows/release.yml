name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # All tags, to find the previous release
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser OSS takes the closest tag as the previous one, possibly a
      # prerelease: a stable release's changelog must start from the previous
      # stable release.
      - name: Find the previous stable release
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -v '[-]' \
            | awk -v tag="$GITHUB_REF_NAME" 'found { print; exit } $0 == tag { found = 1 }')
          if [[ -n "$previous" ]]; then
            echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
